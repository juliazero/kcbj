[include fluidd.cfg]
[include macros.cfg]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[mcu]
#serial: /dev/ttyS0
#restart_method: command
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_30FFD8054250323632701357-if00

#[mcu creality]
#serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
#baud: 115200

#[mcu rpizero]
#serial: /tmp/klipper_host_mcu

[printer]
kinematics: limited_cartesian
max_x_velocity: 250
max_y_velocity: 200
max_z_velocity: 10
max_velocity: 250
max_x_accel: 9000
max_y_accel: 3000
max_z_accel: 100
max_accel: 9000
scale_xy_accel: False
square_corner_velocity: 5.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 39.722
endstop_pin: ^PC0
position_endstop: 230
position_max: 230
homing_speed: 50

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 39.904
endstop_pin: ^PC1
position_endstop: 220
position_max: 220
homing_speed: 50

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -7
position_max: 300
homing_speed: 10

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.572515
full_steps_per_rotation: 200
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 135
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
pressure_advance: 0.076
#control: pid
#pid_Kp: 26.1747
#pid_Ki: 2.7494
#pid_Kd: 62.2958
min_temp: 0
max_temp: 270
min_extrude_temp: 210

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
sense_resistor: 0.110
interpolate: true

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.560
sense_resistor: 0.110
interpolate: true

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.560
sense_resistor: 0.110
interpolate: true

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.350
sense_resistor: 0.110
interpolate: true

[autotune_tmc stepper_x]
motor: kelimotor-bj42d15-26v09 #BJ42D15-26V02 (Creality 42-34)
tuning_goal: silent

[autotune_tmc stepper_y]
motor: BJ42D22-23V01 #BJ42D22-23W02 (Creality 42-40(S))
tuning_goal: silent

[autotune_tmc stepper_z]
motor: moons-c17hd2024n-01n #C17Hd2024-01n (42-40)
tuning_goal: silent

[autotune_tmc extruder]
motor: kelimotor-bj42d15-26v09 #C17Hd0004-02(42-34)
tuning_goal: silent

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
#control: pid
#pid_Kp: 92.8719
#pid_Ki: 18.1390
#pid_Kd: 317.0028
min_temp: 0
max_temp: 90

[heater_fan heatbreak_cooling_fan] 
pin: PC7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[fan]
pin: PC6
hardware_pwm: True

#[adxl345]
#cs_pin: opi:None
#spi_bus: spidev0.0

#[resonance_tester]
#accel_chip: adxl345
#probe_points:    110, 110, 20  # an example

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

#[display]
#lcd_type: emulated_st7920
#en_pin: EXP1_7
#spi_software_sclk_pin: EXP1_6
#spi_software_mosi_pin: EXP1_8
#spi_software_miso_pin: EXP1_1
#encoder_pins: ^EXP1_5, ^EXP1_3
#click_pin: ^!EXP1_2

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
pin_up_touch_mode_reports_triggered: True
probe_with_touch_mode: False
stow_on_each_sample: False
x_offset: 2
y_offset: -38
z_offset: 2.850
speed: 30
pin_move_time: 0.675
sample_retract_dist: 2
lift_speed: 30
samples: 4
samples_result: average
samples_tolerance: 0.015
samples_tolerance_retries: 8

 
[safe_z_home]
home_xy_position: 115,148
#home_xy_position: 116,220
speed: 150
z_hop: 10
z_hop_speed: 10

[force_move]
enable_force_move: true 

# [bed_mesh]
# speed: 150
# horizontal_move_z: 5
# mesh_min: 10,10
# mesh_max: 210,182
# probe_count: 5,5
# ALGORITHM: bicubic
# mesh_pps: 2,2
# bicubic_tension: .2
# zero_reference_position: 110,148
# fade_start: 1.0
# fade_end: 4.0
# move_check_distance: 4
# split_delta_z: .025

[bed_mesh]
speed: 150
mesh_min: 10,10
mesh_max: 210,182
probe_count: 4,3
fade_start: 1.0
fade_end: 4.0
move_check_distance: 4


[screws_tilt_adjust] 
horizontal_move_z: 10
screw1: 30,63
screw1_name: Front Left
screw2: 200,63
screw2_name: Front Right
screw3: 200,220
screw3_name: Back Right
screw4: 30,220
screw4_name: Back Left
screw_thread: CW-M3
speed: 150

[temperature_sensor mcu_rpizero]
sensor_type: temperature_host
max_temp: 100

[temperature_sensor mcu]
sensor_type: temperature_mcu
max_temp: 100 

[firmware_retraction]
retract_length: 0.4
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 30
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 30
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

