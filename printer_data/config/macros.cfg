[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}
    SKEW_PROFILE LOAD=my_skew_profile
    # BED_MESH_PROFILE LOAD=default
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0
    # Use absolute coordinates
    G90
    M83
    # Start bed heating
    M140 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    {% if printer.extruder.temperature < (EXTRUDER_TEMP - 100) %}
        M109 S{EXTRUDER_TEMP - 100}
    {% endif %}
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Home the printer
    G28
    # Adaptive bed mesh calibration
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    G1 Z15 F2000
    G1 X0 Y40 F3000
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    G92 E0 ; Reset Extruder
    G1 Z2 F3000
    G1 X0 Y40 Z0.2 F5000; Przesuń do pozycji startowej
    G1 X0 Y180 Z0.2 F1500 E15 ;Narysuj pierwszą linię
    G1 X0.7 Y180 Z0.1 F5000 ;Przesuń trochę na bok
    G1 X0.7 Y40 Z0.2 F1500 E15 ;Narysuj drugą linię   
    G92 E0 ; Reset Extruder
    G1 Z2 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed

# gcode:
#     {% set BED_TEMP = params.BED_TEMP|default(70)|float %}
#     {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}
